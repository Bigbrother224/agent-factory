name: fleet-b

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: fleet-b-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    # Porte 1 passée : l'issue labelée idea/approved déclenche la flotte B (Aider × Ollama).
    if: github.event.label.name == 'idea/approved'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Outils (aider + identité git)
        run: |
          chmod +x verify.sh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv tool install --python 3.12 aider-chat
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config user.name "fleet-b-aider"
          git config user.email "actions@users.noreply.github.com"
          aider --version

      - name: Brief (contrat B + axe + barème + skill langage + spec de l'issue)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Garde anti double-run : retirer/remettre idea/approved ne relance pas la flotte
          # sur une idée déjà livrée (ship/pr posé par un cycle précédent).
          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels -q '[.labels[].name]' 2>/dev/null || echo '[]')
          if printf '%s' "$LABELS" | grep -q 'ship/pr'; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Flotte B ignorée : cette idée est déjà livrée (label ship/pr — PR en attente de porte 2). Pour la corriger, commente \`!fix …\` sur cette issue."
            echo "DUPLICATE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # Hygiène : approuvée ≠ brouillon.
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "idea/draft" >/dev/null 2>&1 || true
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body,labels > /tmp/issue.json
          AXE=$(python3 -c "import json;d=json.load(open('/tmp/issue.json'));print(next((l['name'].removeprefix('axe/') for l in d['labels'] if l['name'].startswith('axe/')),''))")
          if [ -z "$AXE" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Blocage : l'issue n'a pas de label d'axe (axe/ai-automation-and-systems, axe/embedded-intelligence ou axe/experimental-computing). Ajoute l'axe puis relance en retirant/reposant idea/approved."
            gh issue edit "$ISSUE_NUMBER" --remove-label "idea/approved"
            exit 1
          fi
          SLUG=$(python3 fleet/slugify.py "$ISSUE_TITLE")
          python3 -c "import json;print(json.load(open('/tmp/issue.json'))['body'])" > /tmp/spec.md
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "AXE=$AXE" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"
          # Skill langage (craft concret pour la session) : injecté si la spec le déclare.
          LANG=$(grep -ioE "langage *: *(node|go|python)" /tmp/spec.md | tail -1 | grep -ioE "node|go|python" || true)
          {
            echo "# Tâche — flotte B"
            echo
            echo "Axe du portfolio : **$AXE** — le projet vit dans projects/$AXE/$SLUG/."
            echo
            echo "Projet à créer : **projects/$AXE/$SLUG/**"
            echo
            cat fleet/CONTRAT-B.md
            echo
            echo "## Barème qualité (exigé, non négociable)"
            echo
            cat fleet/BAREME.md
            if [ -n "$LANG" ] && [ -f "fleet/skills/$LANG.md" ]; then
              echo
              echo "## Craft $LANG (skill de la flotte)"
              echo
              cat "fleet/skills/$LANG.md"
            fi
            echo
            echo "## Spécification (issue #$ISSUE_NUMBER)"
            echo
            cat /tmp/spec.md
          } > /tmp/brief.md

      - name: Session Aider (max 3 tentatives, arbitre verify.sh entre chacune)
        env:
          OPENAI_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [ "${DUPLICATE:-0}" = "1" ]; then echo ">>> Doublon ignoré (ship/pr déjà posé)."; exit 0; fi
          AIDER="aider --model openai/glm-5.3-flash:cloud --openai-api-base https://ollama.com/v1 \            --weak-model openai/glm-5.3-flash:cloud --edit-format udiff \
            --yes-always --no-auto-lint --no-check-update \
            --no-attribute-author --no-attribute-committer \
            --no-attribute-commit-message-author --no-attribute-commit-message-committer"
          GREEN=0
          for ATTEMPT in 1 2 3; do
            echo "=== Tentative $ATTEMPT/3 ==="
            if [ "$ATTEMPT" = "1" ]; then
              $AIDER --test-cmd "./verify.sh $AXE/$SLUG" --auto-test --message-file /tmp/brief.md
            else
              $AIDER --test-cmd "./verify.sh $AXE/$SLUG" --auto-test \
                --message "L'arbitre ./verify.sh $AXE/$SLUG est ROUGE (tentative $ATTEMPT/3). Diagnostique avec le runner de tests du projet, corrige les vraies causes (ne bidouille pas les tests), jusqu'au vert complet de ./verify.sh $AXE/$SLUG. Ne modifie rien en dehors de projects/$AXE/$SLUG/."
            fi
            if ./verify.sh "$AXE/$SLUG"; then GREEN=1; break; fi
          done
          ./verify.sh "$AXE/$SLUG" > /tmp/verify-final.txt 2>&1 || true
          echo "GREEN=$GREEN" >> "$GITHUB_ENV"

      - name: PR + arbitrage CI (si vert) ou verdict verify/failed (si rouge après 3)
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [ "${DUPLICATE:-0}" = "1" ]; then exit 0; fi
          if [ "$GREEN" != "1" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "3 tentatives épuisées : l'arbitre ./verify.sh $AXE/$SLUG reste rouge. Label verify/failed posé, pas de PR. Sortie finale : $(tail -3 /tmp/verify-final.txt | tr '\n' ' ')"
            gh issue edit "$ISSUE_NUMBER" --add-label "verify/failed"
            exit 0
          fi
          git add -A
          git commit -m "flotte B : $SLUG (MVP, verify.sh vert)" --allow-empty || true
          git checkout -b "fleet/$SLUG"
          git push -u origin "fleet/$SLUG" --force
          {
            echo "Livrable de la flotte B (Aider × glm-5.3-flash, plan Ollama) pour l'issue #$ISSUE_NUMBER."
            echo
            echo "Sortie finale de l'arbitre \`./verify.sh $AXE/$SLUG\` :"
            echo '```'
            tail -15 /tmp/verify-final.txt
            echo '```'
          } > /tmp/pr-body.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "fleet/$SLUG" \
            --title "[$AXE] $SLUG — MVP (flotte B)" --body-file /tmp/pr-body.md
          PR_URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "fleet/$SLUG" --json url -q '.[0].url')

          # --- Groupe C : arbitrage CI avec relances auto (max 3 cycles). ---
          # CI rouge alors que l'arbitre local est vert (écart d'environnement) :
          # session Aider correctrice sur le log d'échec, push, ré-arbitrage.
          AIDER="aider --model openai/glm-5.3-flash:cloud --openai-api-base https://ollama.com/v1 \
            --weak-model openai/glm-5.3-flash:cloud --edit-format udiff \
            --yes-always --no-auto-lint --no-check-update \
            --no-attribute-author --no-attribute-committer \
            --no-attribute-commit-message-author --no-attribute-commit-message-committer"
          CI_GREEN=0
          for CI_TRY in 1 2 3; do
            echo "=== CI (groupe C) — cycle $CI_TRY/3 sur $PR_URL ==="
            for _ in $(seq 1 30); do
              N=$(gh pr checks "$PR_URL" --repo "$GITHUB_REPOSITORY" --json name 2>/dev/null | jq 'length' 2>/dev/null || echo 0)
              [ "${N:-0}" -gt 0 ] 2>/dev/null && break
              sleep 10
            done
            gh pr checks "$PR_URL" --repo "$GITHUB_REPOSITORY" --watch >/dev/null 2>&1 || true
            if gh pr checks "$PR_URL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then CI_GREEN=1; break; fi
            [ "$CI_TRY" = "3" ] && break
            FAIL_LINK=$(gh pr checks "$PR_URL" --repo "$GITHUB_REPOSITORY" --json name,state,link \
              -q '[.[] | select(.state=="FAILURE" or .state=="fail")][0].link' 2>/dev/null || true)
            # Le link est une URL de JOB — extraire l'ID de RUN, pas le basename.
            RUN_ID=$(printf '%s' "$FAIL_LINK" | grep -oE '/runs/[0-9]+' | grep -oE '[0-9]+' || true)
            if [ -n "$RUN_ID" ]; then
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/ci-red.txt 2>&1 \
                || echo "log CI indisponible (run $RUN_ID)" > /tmp/ci-red.txt
            else
              echo "log CI indisponible" > /tmp/ci-red.txt
            fi
            {
              echo "La CI GitHub est ROUGE alors que l'arbitre local \`./verify.sh $AXE/$SLUG\` est vert (écart d'environnement). Extrait du log du check en échec :"
              echo
              echo '```'
              tail -40 /tmp/ci-red.txt
              echo '```'
              echo
              echo "Diagnostique l'écart, corrige la vraie cause UNIQUEMENT dans projects/$AXE/$SLUG/, puis assure-toi que ./verify.sh $AXE/$SLUG reste vert."
            } > /tmp/ci-fix.md
            $AIDER --test-cmd "./verify.sh $AXE/$SLUG" --auto-test --message-file /tmp/ci-fix.md || true
            if ! ./verify.sh "$AXE/$SLUG" > /tmp/verify-retry.txt 2>&1; then
              echo ">>> La relance a cassé l'arbitre local — arrêt des relances CI."
              cp /tmp/verify-retry.txt /tmp/verify-final.txt 2>/dev/null || true
              break
            fi
            git add -A
            git commit -m "relance CI $CI_TRY/3 : correctif $SLUG" --allow-empty || true
            git push origin "fleet/$SLUG" --force
            # Laisse la CI du NOUVEAU SHA démarrer avant de relire les checks
            # (sinon --watch peut surveiller les checks de l'ancien push).
            sleep 20
          done

          if [ "$CI_GREEN" = "1" ]; then
            gh pr edit "$PR_URL" --add-label "verify/ok"
            gh issue edit "$ISSUE_NUMBER" --add-label "ship/pr" --remove-label "verify/failed"
            echo ">>> verify/ok + ship/pr posés — porte 2 humaine."
          else
            gh pr comment "$PR_URL" --repo "$GITHUB_REPOSITORY" \
              --body "CI rouge après 3 cycles correctifs (relances auto épuisées). Dernier échec : $(tail -3 /tmp/ci-red.txt 2>/dev/null | tr '\n' ' ')" || true
            gh issue edit "$ISSUE_NUMBER" --add-label "verify/failed"
            echo ">>> verify/failed posé après épuisement des relances."
          fi