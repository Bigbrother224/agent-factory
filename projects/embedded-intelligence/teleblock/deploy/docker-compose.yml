# TeleBlock — déploiement Docker Compose (roadmap T6).
#
# Compatible « déjà un Pi-hole » :
#   - le port DNS hôte est surchargeable via TELEBLOCK_DNS_PORT (53 par
#     défaut ; deploy/.env, écrit par install.sh, bascule sur 5353 quand
#     un Pi-hole occupe déjà le 53) ;
#   - install.sh importe la gravity Pi-hole dans l'état TeleBlock.
#
# network_mode: host est REQUIRED : la redirection iptables des flux TCP
# 443 des TV (T1, appliquée par deploy/entrypoint.sh) doit voir le
# trafic du LAN — un bridge ne publierait que le 53 et laisserait
# l'inspecteur SNI inopérant. L'état d'apprentissage (T3) persiste via
# le montage vers /var/lib/teleblock (surchargeable par TELEBLOCK_STATE,
# que install.sh exporte).

services:
  teleblock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    command:
      - -listen
      - ":${TELEBLOCK_DNS_PORT:-53}"
      - -tls-listen
      - ":${TELEBLOCK_TLS_PORT:-8449}"
      - -observe-state
      - /var/lib/teleblock/observe.json
    volumes:
      - "${TELEBLOCK_STATE:-./data}:/var/lib/teleblock"