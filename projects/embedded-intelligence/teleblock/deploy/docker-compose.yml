# TeleBlock — déploiement Docker Compose (roadmap T6).
#
# Compatible « déjà un Pi-hole » :
#   - le port DNS hôte est surchargeable via TELEBLOCK_DNS_PORT (53 par
#     défaut ; deploy/.env, écrit par install.sh, bascule sur 5353 quand
#     un Pi-hole occupe déjà le 53) ;
#   - install.sh importe la gravity Pi-hole dans l'état TeleBlock.
#
# L'état d'apprentissage (T3) persiste via le montage ./data ->
# /var/lib/teleblock (surchargeable par TELEBLOCK_STATE). La redirection
# iptables des flux TCP 443 bloqués (T1) requiert NET_ADMIN.

services:
  teleblock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${TELEBLOCK_DNS_PORT:-53}:53/udp"
      - "${TELEBLOCK_DNS_PORT:-53}:53/tcp"
    volumes:
      - "${TELEBLOCK_STATE:-./data}:/var/lib/teleblock"
    cap_add:
      - NET_ADMIN
